<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b10" />
    <title>Checkout — Dyno Collections</title>
    <meta name="description" content="Checkout — Dyno Collections" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="./index.html" aria-label="Dyno Collections home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12 2.5c4.8 0 8.7 3.9 8.7 8.7S16.8 19.9 12 21.5C7.2 19.9 3.3 16 3.3 11.2S7.2 2.5 12 2.5Z"
                stroke="currentColor"
                stroke-width="1.6"
              />
              <path
                d="M8 12.4c1.8-2.7 5.6-4.1 8-4.4-.4 2.6-1.8 6.5-4.5 8.3-1.7 1.2-3.7 1.1-4.8.7.7-1.1 1.1-2.7 1.3-4.6Z"
                fill="currentColor"
                opacity="0.9"
              />
            </svg>
          </span>
          <span class="brand-text">Dyno <span class="muted">Collections</span></span>
        </a>

        <div class="header-actions">
          <a class="btn btn-ghost" href="./index.html">Back to shop</a>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="container">
        <div class="section-head">
          <div>
            <h2>Checkout</h2>
            <p class="sub">This is a front-end demo checkout. Cart is saved in your browser.</p>
          </div>
        </div>

        <div class="checkout">
          <section class="card" aria-label="Delivery & contact">
            <h2>Delivery details</h2>
            <form class="form" data-checkout-form>
              <div class="field">
                <label for="name">Full name</label>
                <input id="name" name="name" autocomplete="name" required placeholder="e.g. Paul Anyebe" />
              </div>
              <div class="field">
                <label for="phone">Phone</label>
                <input id="phone" name="phone" autocomplete="tel" required placeholder="e.g. 0800 000 0000" />
              </div>
              <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
              </div>
              <div class="field">
                <label for="state">State</label>
                <select id="state" name="state" required>
                  <option value="">Select</option>
                  <option>Lagos</option>
                  <option>Abuja (FCT)</option>
                  <option>Rivers</option>
                  <option>Oyo</option>
                  <option>Others</option>
                </select>
              </div>
              <div class="field">
                <label for="address">Address</label>
                <input id="address" name="address" autocomplete="street-address" required placeholder="Street, city" />
              </div>

              <button class="btn btn-primary" type="submit">Place order (demo)</button>
              <p class="muted" style="margin:0">Want real payments? I can integrate Paystack/Flutterwave + order email.</p>
            </form>
          </section>

          <aside class="card" aria-label="Order summary">
            <h2>Order summary</h2>
            <div class="order-list" data-order-list></div>

            <div class="divider"></div>

            <div class="order-line">
              <span class="muted">Subtotal</span>
              <strong data-subtotal>₦0</strong>
            </div>
            <div class="order-line">
              <span class="muted">Delivery</span>
              <strong class="muted">Calculated</strong>
            </div>
            <div class="order-line" style="margin-top:8px">
              <span style="font-weight:950">Total</span>
              <strong data-total>₦0</strong>
            </div>

            <div class="divider"></div>

            <a class="btn btn-ghost" href="./index.html#bestsellers">Continue shopping</a>
          </aside>
        </div>
      </div>
    </main>

    <script src="./checkout.js" defer></script>
  </body>
</html>
